name: CI

on: [pull_request, push]

jobs:
  build_test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Report Compressed Size
        uses: ./
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          # `npm run build` also compiles the TypeScript sources into lib/;
          # the bundle and the compiled files each get their own table.
          pattern: |
            index.js
            lib/**/*.js
          # lib/ is untracked, so remove it before the base branch is built.
          clean-script: clean
          compression: "none"
